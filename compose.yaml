services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql

  localstack:
    image: localstack/localstack:4.9.2
    network_mode: host
    environment:
      SERVICES: sqs
      GATEWAY_LISTEN: 127.0.0.1:4566
      LOCALSTACK_HOST: 127.0.0.1:4566
      DNS_ADDRESS: "0"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    network_mode: host
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json

  api:
    build: .
    network_mode: host
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle}@/${POSTGRES_DB:-jungle}?host=/var/run/postgresql&sslmode=disable"
      HTTP_ADDR: 127.0.0.1:8080
      MIGRATIONS_DIR: /migrations
      OIDC_ISSUER: http://127.0.0.1:8081/realms/jungle
      WALLET_CLIENT_ID: wallet-service
      SQS_ENDPOINT: http://127.0.0.1:4566
    volumes:
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-socket:
