services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql

  api:
    build: .
    network_mode: host
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle}@/${POSTGRES_DB:-jungle}?host=/var/run/postgresql&sslmode=disable"
      HTTP_ADDR: 127.0.0.1:8080
      MIGRATIONS_DIR: /migrations
    volumes:
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-socket:
